
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #1c1c1c;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            color: #bbb;
        }

        .search {
            display: flex;
            justify-content: center;
            margin: 25px;
        }

        .search input {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1100px;
            margin: auto;
        }

        .book {
            background: #222;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .book h2 {
            margin-bottom: 10px;
        }

        .book p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .book button {
            padding: 10px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: white;
            color: black;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 My Book Library</h1>
        <p>Read your favorite books online</p>
    </header>

    <div class="search">
        <input type="text" placeholder="Search books...">
    </div>

    <section class="books">

        <div class="book">
            <h2>Book 1</h2>
            <p>Sample Book</p>
            <button>Read Book</button>
        </div>

        <div class="book">
            <h2>Book 2</h2>
            <p>Sample Book</p>
            <button>Read Book</button>
        </div>

        <div class="book">
            <h2>Book 3</h2>
            <p>Sample Book</p>
            <button>Read Book</button>
        </div>

    </section>

    <footer>
        <p>© 2026 My Book Library</p>
    </footer>

</body>
</html>
