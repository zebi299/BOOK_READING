<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Book Library</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: #1b1b1b;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            color: #aaa;
        }

        .search {
            text-align: center;
            padding: 25px;
        }

        .search input {
            width: 90%;
            max-width: 600px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .book {
            background: #222;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .book img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
        }

        .book h2 {
            font-size: 18px;
            margin: 15px 0 5px;
        }

        .book p {
            color: #aaa;
        }

        .book a {
            text-decoration: none;
        }

        .book button {
            padding: 10px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: white;
            color: black;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .books {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .books {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 My Book Library</h1>
    <p>Read your favorite books online</p>
</header>

<div class="search">
    <input type="text" id="search" placeholder="Search books...">
</div>

<section class="books" id="bookList">

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/8231856-L.jpg">
        <h2>The Little Prince</h2>
        <p>Antoine de Saint-Exupéry</p>

        <a href="https://www.gutenberg.org/ebooks/174" target="_blank">
            <button>Read Book</button>
        </a>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/10521270-L.jpg">
        <h2>Alice in Wonderland</h2>
        <p>Lewis Carroll</p>

        <a href="https://www.gutenberg.org/ebooks/11" target="_blank">
            <button>Read Book</button>
        </a>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/8231996-L.jpg">
        <h2>Pride and Prejudice</h2>
        <p>Jane Austen</p>

        <a href="https://www.gutenberg.org/ebooks/1342" target="_blank">
            <button>Read Book</button>
        </a>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/id/8228691-L.jpg">
        <h2>Frankenstein</h2>
        <p>Mary Shelley</p>

        <a href="https://www.gutenberg.org/ebooks/84" target="_blank">
            <button>Read Book</button>
        </a>
    </div>

</section>

<script>

    const searchBox = document.getElementById("search");
    const books = document.querySelectorAll(".book");

    searchBox.addEventListener("input", function() {

        const searchText = searchBox.value.toLowerCase();

        books.forEach(function(book) {

            const title = book.querySelector("h2").textContent.toLowerCase();

            if (title.includes(searchText)) {
                book.style.display = "block";
            } else {
                book.style.display = "none";
            }

        });

    });

</script>

</body>
</html>
